name: WESP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  qt-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install headless Qt graphics libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install PyQt6==6.10.2 PyQt6-Qt6==6.10.2
      - name: Save receiver settings through the real QML form
        run: python check_qml_setup.py -v
  receiver-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.1.18
      - name: Compile ESP32 receiver without hardware
        run: python build_native_receiver.py --output-dir "$RUNNER_TEMP/wesp-receiver"
      - uses: actions/upload-artifact@v4
        with:
          name: wesp-receiver-firmware
          path: ${{ runner.temp }}/wesp-receiver/receiver-firmware/
  python-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          node --version
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext
          python -m pip install -r requirements.txt
      - name: Tests, source hygiene and cold archive lifecycle
        run: python check_release.py
